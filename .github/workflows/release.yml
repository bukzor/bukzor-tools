name: release

# One repo, many publishable packages, so the tag names which one:
# `<dist>-v<version>`, e.g. `claude-code-slug-v0.1.0`. A new member needs a
# PyPI trusted publisher and a tag -- not an edit to this file.
on:
  push:
    tags: ["*-v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - run: |
          echo "package=${GITHUB_REF_NAME%-v*}" >>"$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME##*-v}" >>"$GITHUB_ENV"

      - run: uv build --package "$package"

      # A release is immutable, so a tag that disagrees with the version in
      # pyproject.toml must fail here rather than upload the wrong number.
      - name: the tag must name the version that was built
        run: ls "dist/${package//-/_}-${version}.tar.gz"

      - run: uv publish
