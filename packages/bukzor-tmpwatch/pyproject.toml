[project]
name = "bukzor-tmpwatch"
version = "0.1.0"
description = "Two-phase GC for scratch directories: quarantine, then purge"
license = "Apache-2.0"
authors = [{ name = "Buck Evan", email = "workitharder+pypi@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
bukzor-tmpwatch = "bukzor_tmpwatch.cli:main"

[project.urls]
Repository = "https://github.com/bukzor/bukzor-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/bukzor_tmpwatch"]
exclude = ["**/*_test.py"]
