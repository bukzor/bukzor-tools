[project]
name = "claude-code-slug"
version = "0.1.0"
description = "Claude Code's projects/<slug>/ path encoding, as a function"
readme = "README.md"
license = "Apache-2.0"
# Apache-2.0 section 4 wants the license to travel with the artifact, and a
# wheel is not the repo -- so the file is copied in beside the package.
license-files = ["LICENSE"]
authors = [{ name = "Buck Evan", email = "workitharder+pypi@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
claude-slug = "claude_code_slug.slug:main"
claude-path = "claude_code_slug.path:main"

[project.urls]
Repository = "https://github.com/bukzor/bukzor-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/claude_code_slug"]
exclude = ["**/*_test.py"]
