[project]
name = "upstream-replies"
version = "0.1.0"
description = "Nag about activity on upstream issue threads I reported to"
license = "Apache-2.0"
authors = [{ name = "Buck Evan", email = "workitharder+pypi@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["google-issuetracker"]

[project.scripts]
upstream-replies = "upstream_replies.cli:main"

[project.urls]
Repository = "https://github.com/bukzor/bukzor-tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/upstream_replies"]
exclude = ["**/*_test.py"]

[tool.uv.sources]
google-issuetracker = { workspace = true }
